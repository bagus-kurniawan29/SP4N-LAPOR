<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaporan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="{% static 'images/logo.ico' %}" type="image/x-icon">
    <style>
        .html{ scroll-behavior: smooth; }
        .geometric-pattern { background-image: radial-gradient(circle at 1px 1px, rgb(59, 130, 246, 0.15) 1px, transparent 0); background-size: 40px 40px; }
    </style>
</head>
<body class="bg-gray-50"> 
    <header class="items-center justify-center p-4 bg-white shadow-md flex sticky top-0 z-50 ">
        <header class="items-center justify-center p-4 bg-white shadow-md flex sticky top-0 z-50 ">
    <nav class="underline-none font-semibold flex items-center gap-16 justify-center">
        <a href="{% url 'beranda' %}" class="outline-none flex items-start gap-2 text-blue-600 hover:text-blue-800">
            <svg class="w-6 h-6 fill-current text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M11.03 5.47a.75.75 0 0 1 0 1.06l-4.375 4.375H21a.75.75 0 0 1 0 1.5h-11.375l4.375 4.375a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0z" />
            </svg>
        </a>
        
        {% if user.is_staff %}
            <a href="{% url 'admin_dashboard' %}" class="hover:text-blue-800">Lihat Semua Pengaduan</a>
        {% else %}
            <a href="#" class="text-blue-600 font-semibold">Buat Pengaduan</a>
        {% endif %}
        
        <a href="{% url 'laporan_saya' %}" class="hover:text-blue-800">Pengaduan saya</a>
    </nav>
</header>
    </header>
    <div class="justify-center items-center mt-16 md:flex md:justify-center md:items-center md:ml-32 md:text-center">
        <h1 class="max-w-5xl md:text-5  xl font-bold text-center md:max-w-none">Halo <span class="text-blue-600 uppercase underline">{{ user.username}}</span> Silahkan Laporkan Keluhan Anda</h1>
    </div>
    <div class="justify-center flex items-center bg-white shadow-[0_0_15px_rgba(0,0,0,0.15)] p-6 mt-10 mb-16 mx-4 md:mx-32 rounded-lg  mx-auto">
        <form method="POST" enctype="multipart/form-data" class="items-left w-full justify-center flex flex-col p-4 md:p-8 max-w-4xl">
            {% csrf_token %} <p class="font-semibold mb-2">Tanggal Pelaporan</p>
            <input type="date" name="tanggal_pelaporan" required class="border border-gray-300 rounded-lg p-2 w-full mb-4 focus:ring-2 focus:ring-blue-500 outline-none" />
            <p class="font-semibold mb-2">Isi Laporan</p>
            <textarea name="isi_laporan" required class="border border-gray-300 rounded-lg p-2 w-full mb-4 h-40 break-all resize-none focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Isi Laporan Pengaduan Anda Disini..."></textarea>
            <p class="font-semibold mb-2">Unggah Foto (Opsional)</p>
            <div class="w-full mb-6">
                <label for="file-upload" id="drop-zone" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition duration-300">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6" id="preview-container">
                        <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500 text-center"><span class="font-semibold">Klik untuk upload</span> atau drag and drop</p>
                        <p class="text-xs text-gray-500 text-center">SVG, PNG, JPG (Max. 2MB)</p>
                    </div>

                    <img id="image-preview" class="hidden h-full w-full object-contain rounded-lg p-2" />
                    
                    <input id="file-upload" name="gambar_bukti" type="file" class="hidden" accept="image/*" />
                </label>
            </div>

            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md transition duration-300 w-full md:w-auto self-start">
                Kirim Laporan
            </button>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-upload');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');

        // Prevent default behavior (Prevent file from being opened)
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
            dropZone.classList.remove('border-gray-300');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            dropZone.classList.add('border-gray-300');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                fileInput.files = files;
                showPreview(files[0]);
            }
        }

        function showPreview(file) {
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    imagePreview.src = reader.result;
                    imagePreview.classList.remove('hidden');
                    previewContainer.classList.add('hidden');
                };
            }
        }
    </script>
</body>
</html>
